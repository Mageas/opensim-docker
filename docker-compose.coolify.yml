# Paste into a Coolify "Docker Compose Empty" resource: see docs/coolify/.

services:

  db:
    image: mariadb:11.4
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: ${SERVICE_PASSWORD_MYSQLROOT}
      MARIADB_DATABASE: opensim
      MARIADB_USER: opensim
      MARIADB_PASSWORD: ${SERVICE_PASSWORD_MYSQL}

    # Assets (textures, meshes, sounds) are stored as blobs, larger than the default packet limit.
    command:
      - --max-allowed-packet=128M
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL:-512M}
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    volumes:
      - opensim-db:/var/lib/mysql

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  opensim:
    image: ghcr.io/mageas/opensim:${OPENSIM_IMAGE_TAG:-stable}
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    # Keeps the OpenSim console reachable with `docker attach`.
    stdin_open: true
    tty: true

    environment:
      OPENSIM_PUBLIC_HOST: ${OPENSIM_PUBLIC_HOST:?}
      OPENSIM_PORT: ${OPENSIM_PORT:-9000}
      OPENSIM_HYPERGRID: ${OPENSIM_HYPERGRID:-false}
      OPENSIM_GRID_NAME: ${OPENSIM_GRID_NAME:-My OpenSim}
      OPENSIM_GRID_NICK: ${OPENSIM_GRID_NICK:-myopensim}
      OPENSIM_WELCOME: ${OPENSIM_WELCOME:-Welcome!}
      OPENSIM_PHYSICS: ${OPENSIM_PHYSICS:-BulletSim}
      OPENSIM_REGION_NAME: ${OPENSIM_REGION_NAME:-My Region}
      OPENSIM_REGION_LOCATION: ${OPENSIM_REGION_LOCATION:-1000,1000}
      OPENSIM_REGION_SIZE: ${OPENSIM_REGION_SIZE:-256}
      OPENSIM_ESTATE_NAME: ${OPENSIM_ESTATE_NAME:-My Estate}
      OPENSIM_OWNER_FIRSTNAME: ${OPENSIM_OWNER_FIRSTNAME:-Admin}
      OPENSIM_OWNER_LASTNAME: ${OPENSIM_OWNER_LASTNAME:-Opensim}
      OPENSIM_OWNER_PASSWORD: ${SERVICE_PASSWORD_OWNER}
      OPENSIM_OWNER_EMAIL: ${OPENSIM_OWNER_EMAIL:-admin@example.com}
      MYSQL_HOST: db
      MYSQL_DATABASE: opensim
      MYSQL_USER: opensim
      MYSQL_PASSWORD: ${SERVICE_PASSWORD_MYSQL}

    # OpenSim announces OPENSIM_PORT to viewers, so both sides of the mapping must match.
    # No Coolify domain: its proxy only carries HTTP, and the region needs UDP.
    # One more "<port>:<port>/udp" line per extra region.
    ports:
      - "${OPENSIM_PORT:-9000}:${OPENSIM_PORT:-9000}/tcp"
      - "${OPENSIM_PORT:-9000}:${OPENSIM_PORT:-9000}/udp"

    volumes:
      - opensim-regions:/opt/opensim/bin/Regions
      - opensim-backups:/opt/opensim/bin/backups
      - opensim-scripts:/opt/opensim/bin/ScriptEngines

    # OpenSim saves changed objects on shutdown.
    stop_grace_period: 60s


  # Creates the portal's MariaDB account and table, then exits. It waits for OpenSim,
  # which creates the tables the account gets rights on.
  web-setup:
    image: ghcr.io/mageas/opensim-web:${OPENSIM_IMAGE_TAG:-stable}
    restart: "no"
    exclude_from_hc: true

    depends_on:
      opensim:
        condition: service_healthy

    command: ["node", "scripts/setup-db.ts"]

    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: opensim
      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_MYSQLROOT}
      MYSQL_USER: opensim_web
      MYSQL_PASSWORD: ${SERVICE_PASSWORD_MYSQLWEB}


  # Account portal. Give it a host of its own in Domains, e.g. https://account.world.example.com:3000
  web:
    image: ghcr.io/mageas/opensim-web:${OPENSIM_IMAGE_TAG:-stable}
    restart: unless-stopped

    depends_on:
      web-setup:
        condition: service_completed_successfully

    environment:
      # The address in the browser, e.g. https://account.world.example.com
      ORIGIN: ${PORTAL_URL:?}
      # Coolify's proxy is the only hop: its X-Forwarded-For entry is the visitor.
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: "1"
      MYSQL_HOST: db
      MYSQL_DATABASE: opensim
      MYSQL_USER: opensim_web
      MYSQL_PASSWORD: ${SERVICE_PASSWORD_MYSQLWEB}
      OPENSIM_GRID_NAME: ${OPENSIM_GRID_NAME:-My OpenSim}
      OPENSIM_LOGIN_URI: http://${OPENSIM_PUBLIC_HOST}:${OPENSIM_PORT:-9000}/
      # false closes account creation.
      SIGNUP_ENABLED: ${PORTAL_SIGNUP_ENABLED:-true}


volumes:
  opensim-db:
  opensim-regions:
  opensim-backups:
  opensim-scripts:
