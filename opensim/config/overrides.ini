; =============================================================================
;  Surcharges de configuration OpenSim
; =============================================================================
;  OpenSim charge, dans l'ordre :
;    1. OpenSimDefaults.ini          (valeurs par défaut de la distribution)
;    2. OpenSim.ini                  (copie de OpenSim.ini.example dans l'image)
;    3. config-include/*.ini          (architecture Standalone / Hypergrid)
;    4. config/*.ini  <- CE FICHIER   (gagne sur tout le reste)
;
;  Les valeurs ${Environment|XXX} viennent des variables d'environnement du
;  conteneur (fichier .env -> docker-compose.yml). Pour ajouter un réglage,
;  copiez la section/clé voulue depuis OpenSim.ini.example ou OpenSimDefaults.ini
;  et redémarrez : docker compose restart opensim
; =============================================================================

[Environment]
    ; Liste des variables d'environnement que OpenSim a le droit de lire
    OPENSIM_PUBLIC_HOST = ""
    OPENSIM_PORT = ""
    OPENSIM_GRID_NAME = ""
    OPENSIM_GRID_NICK = ""
    OPENSIM_WELCOME = ""
    OPENSIM_PHYSICS = ""
    OPENSIM_ESTATE_NAME = ""
    OPENSIM_OWNER_FIRSTNAME = ""
    OPENSIM_OWNER_LASTNAME = ""
    OPENSIM_OWNER_PASSWORD = ""
    OPENSIM_OWNER_EMAIL = ""
    MYSQL_HOST = ""
    MYSQL_DATABASE = ""
    MYSQL_USER = ""
    MYSQL_PASSWORD = ""

[Const]
    ; Nom DNS ou IP publique du serveur. Sert à construire toutes les URLs
    ; annoncées aux viewers (login, assets, inventaire, map, Hypergrid)
    BaseHostname = ${Environment|OPENSIM_PUBLIC_HOST}
    BaseURL = http://${Const|BaseHostname}
    PublicPort = ${Environment|OPENSIM_PORT}

[Network]
    http_listener_port = ${Environment|OPENSIM_PORT}

[Startup]
    ; BulletSim (défaut, x86_64), ubODE, basicphysics (ARM : ubODE ou basicphysics)
    physics = ${Environment|OPENSIM_PHYSICS}
    ; Sauvegarde auto des objets modifiés
    MinimumTimeBeforePersistenceConsidered = 60
    MaximumTimeBeforePersistenceConsidered = 600

[Estates]
    ; Utilisé au tout premier démarrage pour créer l'estate ET le compte du
    ; propriétaire (sans ça, OpenSim pose des questions dans la console).
    DefaultEstateName = ${Environment|OPENSIM_ESTATE_NAME}
    DefaultEstateOwnerName = "${Environment|OPENSIM_OWNER_FIRSTNAME} ${Environment|OPENSIM_OWNER_LASTNAME}"
    DefaultEstateOwnerUUID = 00000000-0000-0000-0000-000000000000
    DefaultEstateOwnerEMail = ${Environment|OPENSIM_OWNER_EMAIL}
    DefaultEstateOwnerPassword = ${Environment|OPENSIM_OWNER_PASSWORD}

[DatabaseService]
    ; Toutes les données (régions, objets, assets, inventaires, comptes) dans MariaDB
    StorageProvider = "OpenSim.Data.MySQL.dll"
    ConnectionString = "Data Source=${Environment|MYSQL_HOST};Database=${Environment|MYSQL_DATABASE};User ID=${Environment|MYSQL_USER};Password=${Environment|MYSQL_PASSWORD};Old Guids=true;SslMode=None;"

[GridService]
    ; Toutes les régions locales peuvent servir de point d'arrivée au login
    DefaultRegionFlags = "DefaultRegion, FallbackRegion, DefaultHGRegion"

[GridInfoService]
    ; Infos renvoyées par http://<hôte>:9000/get_grid_info (lues par Firestorm)
    login = ${Const|BaseURL}:${Const|PublicPort}/
    gridname = ${Environment|OPENSIM_GRID_NAME}
    gridnick = ${Environment|OPENSIM_GRID_NICK}

[LoginService]
    WelcomeMessage = ${Environment|OPENSIM_WELCOME}

[Messaging]
    ; Messages hors-ligne stockés en base
    OfflineMessageModule = "Offline Message Module V2"
    StorageProvider = "OpenSim.Data.MySQL.dll"
    ConnectionString = "Data Source=${Environment|MYSQL_HOST};Database=${Environment|MYSQL_DATABASE};User ID=${Environment|MYSQL_USER};Password=${Environment|MYSQL_PASSWORD};Old Guids=true;SslMode=None;"

[Groups]
    ; Groupes activés, stockés en base locale
    Enabled = true
    Module = "Groups Module V2"
    StorageProvider = "OpenSim.Data.MySQL.dll"
    ServicesConnectorModule = "Groups Local Service Connector"
    LocalService = local
    MessagingEnabled = true
    MessagingModule = "Groups Messaging Module V2"
    ConnectionString = "Data Source=${Environment|MYSQL_HOST};Database=${Environment|MYSQL_DATABASE};User ID=${Environment|MYSQL_USER};Password=${Environment|MYSQL_PASSWORD};Old Guids=true;SslMode=None;"

[UserProfiles]
    ; Profils d'avatars (onglets "Picks", "Classifieds", notes...)
    ProfileServiceURL = ${Const|BaseURL}:${Const|PublicPort}

[UserProfilesService]
    Enabled = true
