; Loaded last, after OpenSimDefaults.ini, OpenSim.ini and config-include/*.ini,
; so every key here wins.

[Environment]
    ; OpenSim only resolves ${Environment|NAME} for the names declared here.
    OPENSIM_PUBLIC_HOST = ""
    OPENSIM_PORT = ""
    OPENSIM_GRID_NAME = ""
    OPENSIM_GRID_NICK = ""
    OPENSIM_WELCOME = ""
    OPENSIM_PHYSICS = ""
    OPENSIM_ESTATE_NAME = ""
    OPENSIM_OWNER_FIRSTNAME = ""
    OPENSIM_OWNER_LASTNAME = ""
    OPENSIM_OWNER_PASSWORD = ""
    OPENSIM_OWNER_EMAIL = ""
    MYSQL_HOST = ""
    MYSQL_DATABASE = ""
    MYSQL_USER = ""
    MYSQL_PASSWORD = ""

[Const]
    BaseHostname = ${Environment|OPENSIM_PUBLIC_HOST}
    BaseURL = http://${Const|BaseHostname}
    PublicPort = ${Environment|OPENSIM_PORT}

[Network]
    http_listener_port = ${Environment|OPENSIM_PORT}

[Startup]
    physics = ${Environment|OPENSIM_PHYSICS}

[Estates]
    ; Without these, the first start stops and asks for the estate owner on the console.
    DefaultEstateName = ${Environment|OPENSIM_ESTATE_NAME}
    DefaultEstateOwnerName = "${Environment|OPENSIM_OWNER_FIRSTNAME} ${Environment|OPENSIM_OWNER_LASTNAME}"
    DefaultEstateOwnerUUID = 00000000-0000-0000-0000-000000000000
    DefaultEstateOwnerEMail = ${Environment|OPENSIM_OWNER_EMAIL}
    DefaultEstateOwnerPassword = ${Environment|OPENSIM_OWNER_PASSWORD}

[DatabaseService]
    StorageProvider = "OpenSim.Data.MySQL.dll"
    ConnectionString = "Data Source=${Environment|MYSQL_HOST};Database=${Environment|MYSQL_DATABASE};User ID=${Environment|MYSQL_USER};Password=${Environment|MYSQL_PASSWORD};Old Guids=true;SslMode=None;"

[GridService]
    ; Applies to every region, so no Region_<name> key is needed per region.
    DefaultRegionFlags = "DefaultRegion, FallbackRegion, DefaultHGRegion"

[GridInfoService]
    login = ${Const|BaseURL}:${Const|PublicPort}/
    gridname = ${Environment|OPENSIM_GRID_NAME}
    gridnick = ${Environment|OPENSIM_GRID_NICK}

[LoginService]
    WelcomeMessage = ${Environment|OPENSIM_WELCOME}

[Messaging]
    OfflineMessageModule = "Offline Message Module V2"
    StorageProvider = "OpenSim.Data.MySQL.dll"
    ConnectionString = "Data Source=${Environment|MYSQL_HOST};Database=${Environment|MYSQL_DATABASE};User ID=${Environment|MYSQL_USER};Password=${Environment|MYSQL_PASSWORD};Old Guids=true;SslMode=None;"

[Groups]
    Enabled = true
    Module = "Groups Module V2"
    StorageProvider = "OpenSim.Data.MySQL.dll"
    ServicesConnectorModule = "Groups Local Service Connector"
    LocalService = local
    MessagingEnabled = true
    MessagingModule = "Groups Messaging Module V2"
    ConnectionString = "Data Source=${Environment|MYSQL_HOST};Database=${Environment|MYSQL_DATABASE};User ID=${Environment|MYSQL_USER};Password=${Environment|MYSQL_PASSWORD};Old Guids=true;SslMode=None;"

[UserProfiles]
    ; The simulator calls this public URL from inside the container: the host
    ; firewall must accept the port on INPUT (see docs/coolify/02-prepare-the-server.md).
    ProfileServiceURL = ${Const|BaseURL}:${Const|PublicPort}

[UserProfilesService]
    Enabled = true
